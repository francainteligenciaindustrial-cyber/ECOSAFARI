<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1412" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ipantanal" />

    <title>Ipantanal — Turismo Ecológico e Safáris Fotográficos</title>
    <meta name="description" content="Reserve pousadas parceiras, guias especializados e roteiros de safári fotográfico no Pantanal, Cerrado e Amazônia. Turismo de observação de vida selvagem com conservação ambiental." />

    <!-- TROQUE https://ipantanal.com.br pelo domínio final assim que
         estiver configurado (ver item 14). WhatsApp/Facebook/Twitter buscam
         og:image e og:url como URL absoluta — um caminho relativo (ex:
         "/species/onca-pintada.png") não funciona no preview de link. -->
    <link rel="canonical" href="https://ipantanal.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ipantanal" />
    <meta property="og:url" content="https://ipantanal.com.br/" />
    <meta property="og:title" content="Ipantanal — Turismo Ecológico e Safáris Fotográficos" />
    <meta property="og:description" content="Reserve pousadas parceiras, guias especializados e roteiros de safári fotográfico no Pantanal, Cerrado e Amazônia." />
    <meta property="og:image" content="https://ipantanal.com.br/species/onca-pintada.png" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ipantanal — Turismo Ecológico e Safáris Fotográficos" />
    <meta name="twitter:description" content="Reserve pousadas parceiras, guias especializados e roteiros de safári fotográfico no Pantanal, Cerrado e Amazônia." />
    <meta name="twitter:image" content="https://ipantanal.com.br/species/onca-pintada.png" />

    <!-- Dados estruturados sitewide (schema.org) — Organization + WebSite,
         separado do LodgingBusiness por pousada (injetado em runtime por
         PousadaDetailsView.tsx via useStructuredData). Ajuda o Google a
         entender quem é a empresa por trás do site nos resultados de busca. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ipantanal",
        "url": "https://ipantanal.com.br/",
        "logo": "https://ipantanal.com.br/favicon.svg",
        "sameAs": ["https://instagram.com/ecosafari"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ipantanal",
        "url": "https://ipantanal.com.br/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
